name: workflow-node

on:
  push:
    branches:
      - develop

jobs:
  job01:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar node
        uses: actions/setup-node@v7
        with: 
          node-version: 24
      
      - name: Node version
        run: |
          node -v
          npm -v